version: '3.8'

services:
  # 1. Servidor perimetral / Edge Router (Nginx)
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: srv-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"  # Único punto de entrada expuesto al host exterior
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - red-corp
    depends_on:
      - apache-app

  # 2. Servidor backend aislado (Apache)
  apache-app:
    image: httpd:2.4-alpine
    container_name: srv-apache-app
    restart: unless-stopped
    command: httpd-foreground -c "Include conf/extra/httpd-vhosts.conf"
    volumes:
      - ./apache/htdocs:/usr/local/apache2/htdocs:ro
      - ./apache/logs:/usr/local/apache2/logs
      - ./apache/httpd-vhosts.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
    networks:
      - red-corp

# 3. Red privada interna
networks:
  red-corp:
    driver: bridge