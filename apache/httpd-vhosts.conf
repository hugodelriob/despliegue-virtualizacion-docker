<VirtualHost *:80>
    ServerName app-gestion.empresa.local
    DocumentRoot "/usr/local/apache2/htdocs"

    CustomLog "logs/access.log" combined
    ErrorLog "logs/error.log"

    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Restricción explícita del endpoint /privado
    <Directory "/usr/local/apache2/htdocs/privado">
        Require expr "%{HTTP:X-Auth-Token} == 'DAW2026'"
    </Directory>
</VirtualHost>